[package]
name = "ex_did_ssi_parity"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssi-dids = { version = "0.5.0", features = ["http", "secp256k1", "secp256r1", "secp384r1"] }
ssi-jwk = { version = "0.4.0", features = ["secp256k1", "secp256r1", "secp384r1"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "io-util"] }
